name: Fork Release APK

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name for release (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build_and_release:
    name: Build & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version-file: .github/.java-version

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Standard & Arm64 APKs
        run: ./gradlew assembleRelease -Pdist=ci -Pinclude-telemetry=false -Penable-updater=true

      - name: Rename and Package APKs
        id: find_apks
        run: |
          TAG="${{ github.event.inputs.tag_name || github.ref_name }}"
          mkdir -p release_apks
          APK_DIR="app/build/outputs/apk/release"

          [ -f "$APK_DIR/app-universal-release.apk" ] && cp "$APK_DIR/app-universal-release.apk" "release_apks/shumi-${TAG}.apk"
          [ -f "$APK_DIR/app-arm64-v8a-release.apk" ] && cp "$APK_DIR/app-arm64-v8a-release.apk" "release_apks/shumi-arm64-v8a-${TAG}.apk"
          [ -f "$APK_DIR/app-armeabi-v7a-release.apk" ] && cp "$APK_DIR/app-armeabi-v7a-release.apk" "release_apks/shumi-armeabi-v7a-${TAG}.apk"
          [ -f "$APK_DIR/app-x86-release.apk" ] && cp "$APK_DIR/app-x86-release.apk" "release_apks/shumi-x86-${TAG}.apk"
          [ -f "$APK_DIR/app-x86_64-release.apk" ] && cp "$APK_DIR/app-x86_64-release.apk" "release_apks/shumi-x86_64-${TAG}.apk"

          ls -la release_apks/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag_name || github.ref_name }}
          name: "Shumi ${{ github.event.inputs.tag_name || github.ref_name }}"
          body: |
            ### Shumi (趣味) — Mihon with Personalized Reading Taste Engine
            - Embedded "For You" tab powered by MangaBaka & AniList.
            - Reading taste learning directly from local Mihon database.
            - Automatic in-app updates supported via ishanpwork/shumi.
          files: release_apks/*.apk
          draft: false
          prerelease: false
